name: Build gfx803 (rocm6.4.4, archived line)

# Manual-only. There is deliberately no schedule: every version in
# rocm6.4.4/Dockerfile is pinned to an immutable ref (ROCm 6.4.4, MIGraphX
# release/rocm-rel-6.4, a torch release branch, an ORT tag), so a nightly run
# would rebuild byte-identical inputs and republish the same image.
#
# This line is archived, not actively developed: rocm7 (this repo's root
# line, see gfx803-rocm7.yml) is where new investigation happens now that
# ROCm 7.14 support is confirmed working. rocm6.4.4 stays hardware-verified
# and buildable, but only gets re-run when a pin needs updating or something
# needs re-verifying, not as ongoing development.
#
# Chain: rocr -> rocblas -> {migraphx, pytorch} -> ort -> final. rocr (patched
# libhsa with the gfx803 VA-reuse defer) is consumed only by the final
# assembly; the component builders compile fine against the base image's
# stock ROCR headers. rocBLAS has to come before MIGraphX/PyTorch because
# both link it and both need the gfx803 rebuild rather than the base image's
# gfx900+ copy. MIGraphX and PyTorch are independent of each other and run
# in parallel; ORT builds against MIGraphX's /opt/rocm; the final job
# assembles everything.
#
# Publishes under a -rocm6.4.4 tag suffix (:latest-gfx803-rocm6.4.4 etc) --
# rocm7 owns the unsuffixed :latest-gfx803/:gfx803 tags now that it's this
# repo's main line. The final image's release-tag (:rocm6.4.4-gfx803) is
# unaffected either way, since the release name already disambiguates it.

on:
  workflow_dispatch:
    inputs:
      build-rocr:
        description: 'Build patched ROCR-Runtime (libhsa, gfx803 VA-reuse defer) for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-rocblas:
        description: 'Build rocBLAS for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-migraphx:
        description: 'Build MIGraphX'
        type: boolean
        required: false
        default: true
      build-pytorch:
        description: 'Build PyTorch + torchvision + torchaudio'
        type: boolean
        required: false
        default: true
      build-ort:
        description: 'Build ONNX Runtime'
        type: boolean
        required: false
        default: true
      pytorch-ref:
        description: 'Override PYTORCH_REF, e.g. release/2.6 (the hardware-verified gfx803 fallback). Leave empty for the Dockerfile default.'
        required: false
        default: ''
      torchvision-ref:
        description: 'Override TORCHVISION_REF, e.g. v0.21.0 to match torch 2.6. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      torchaudio-ref:
        description: 'Override TORCHAUDIO_REF, e.g. v2.6.0 to match torch 2.6. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        type: boolean
        required: false
        default: false
      no-cache:
        description: 'Force a fully fresh build, ignoring the registry build cache (use if a component is suspected stale/corrupted)'
        type: boolean
        required: false
        default: false

jobs:
  rocr:
    if: ${{ inputs.build-rocr }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: rocr
      target: rocr-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  rocblas:
    if: ${{ inputs.build-rocblas }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: rocblas
      target: rocblas-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  # `needs` + a skipped dependency: GitHub reports result == 'skipped', not
  # 'success', so every downstream gate has to accept both -- otherwise
  # unchecking build-rocblas would cascade into skipping the whole pipeline
  # instead of reusing the published rocBLAS image.
  migraphx:
    needs: rocblas
    if: ${{ !cancelled() && inputs.build-migraphx && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: migraphx
      target: migraphx-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-rocblas-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  pytorch:
    needs: rocblas
    if: ${{ !cancelled() && inputs.build-pytorch && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: pytorch
      target: pytorch-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-rocblas-image: true
      pytorch-ref: ${{ inputs.pytorch-ref }}
      torchvision-ref: ${{ inputs.torchvision-ref }}
      torchaudio-ref: ${{ inputs.torchaudio-ref }}
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  ort:
    needs: migraphx
    if: ${{ !cancelled() && inputs.build-ort && (needs.migraphx.result == 'success' || needs.migraphx.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: ort
      target: ort-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-migraphx-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  final:
    needs: [rocr, migraphx, pytorch, ort]
    if: ${{ !cancelled()
      && (needs.rocr.result == 'success' || needs.rocr.result == 'skipped')
      && (needs.migraphx.result == 'success' || needs.migraphx.result == 'skipped')
      && (needs.pytorch.result == 'success' || needs.pytorch.result == 'skipped')
      && (needs.ort.result == 'success' || needs.ort.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: final
      final: true
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-rocr-image: true
      with-migraphx-image: true
      with-pytorch-image: true
      with-ort-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}
