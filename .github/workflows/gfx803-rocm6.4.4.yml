name: Build gfx803 (rocm6.4.4, archived line)

# Manual-only. There is deliberately no schedule: every version in
# rocm6.4.4/Dockerfile is pinned to an immutable ref (ROCm 6.4.4, MIGraphX
# release/rocm-rel-6.4, a torch release branch, an ORT tag), so a nightly run
# would rebuild byte-identical inputs and republish the same image.
#
# This line is archived, not actively developed: rocm10 (this repo's root
# line, see gfx803-rocm10.yml) is where new investigation happens now that
# ROCm 10.0 is the main line. rocm6.4.4 stays hardware-verified
# and buildable, but only gets re-run when a pin needs updating or something
# needs re-verifying, not as ongoing development.
#
# Chain: rocr -> {rocblas, miopen} -> migraphx -> {pytorch is off rocblas
# directly, ort off migraphx} -> final. rocblas and miopen both build against
# rocr's patched runtime from the start (rocm6.4.4/Dockerfile's
# rocblas-builder/miopen-builder both COPY --from=rocr-export before doing
# anything else) rather than linking against the base image's stock runtime
# and having the patch spliced into /opt/rocm/lib only at the final assembly
# step -- nothing here ever runs against anything but the final assembled
# image, so the build environment should match it from the start rather than
# assume a same-SONAME swap-in is equivalent without ever actually building
# against it. migraphx needs BOTH rocblas and miopen for the same reason:
# it's configured with -DMIGRAPHX_USE_MIOPEN=On and genuinely links
# libMIOpen.so, not just a runtime dlopen. pytorch only needs rocblas (not
# miopen or migraphx). ORT builds against MIGraphX's /opt/rocm; the final job
# assembles everything.
#
# `miopen` was missing from this file until it was ported over from a
# pre-split bug in the original single-repo gfx803.yml: without a dedicated
# job + with-miopen-image on final, final's own build silently compiled
# MIOpen from source inline, uncached, inside the one 360-minute final job --
# exactly what gfx803-component.yml's per-component split exists to avoid.
#
# Every `needs.X.result == 'skipped'` check below is scoped to
# `&& !inputs.build-X` -- a skip only counts as "safe to proceed, reuse the
# last published image" when it's the user's own unchecked input. Without
# that guard, a job that gets skipped because ITS OWN upstream dependency
# failed (also reported as result == 'skipped', not 'failure', by GitHub
# Actions) would be indistinguishable from a deliberate skip, and every
# downstream gate would wrongly treat a real failure as "fine, continue" --
# building on top of an image that was never actually rebuilt or never
# existed. A real failure now propagates as false all the way to final,
# so final either doesn't run or the workflow run's overall conclusion is
# still failure, rather than silently assembling a final image on top of a
# missing/stale component.
#
# Publishes under a -rocm6.4.4 tag suffix (:latest-gfx803-rocm6.4.4 etc) --
# rocm10 owns the unsuffixed :latest-gfx803/:gfx803 tags now that it's this
# repo's main line. The final image's release-tag (:rocm6.4.4-gfx803) is
# unaffected either way, since the release name already disambiguates it.

on:
  workflow_dispatch:
    inputs:
      build-rocr:
        description: 'Build patched ROCR-Runtime (libhsa, gfx803 VA-reuse defer) for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-rocblas:
        description: 'Build rocBLAS for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-miopen:
        description: 'Build MIOpen for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-migraphx:
        description: 'Build MIGraphX'
        type: boolean
        required: false
        default: true
      build-pytorch:
        description: 'Build PyTorch + torchvision + torchaudio'
        type: boolean
        required: false
        default: true
      build-ort:
        description: 'Build ONNX Runtime'
        type: boolean
        required: false
        default: true
      pytorch-ref:
        description: 'Override PYTORCH_REF, e.g. release/2.6 (the hardware-verified gfx803 fallback). Leave empty for the Dockerfile default.'
        required: false
        default: ''
      torchvision-ref:
        description: 'Override TORCHVISION_REF, e.g. v0.21.0 to match torch 2.6. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      torchaudio-ref:
        description: 'Override TORCHAUDIO_REF, e.g. v2.6.0 to match torch 2.6. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        type: boolean
        required: false
        default: false
      no-cache:
        description: 'Force a fully fresh build, ignoring the registry build cache (use if a component is suspected stale/corrupted)'
        type: boolean
        required: false
        default: false

jobs:
  rocr:
    if: ${{ inputs.build-rocr }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: rocr
      target: rocr-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  # rocblas and miopen both build against the patched rocr from the start
  # now (rocm6.4.4/Dockerfile's rocblas-builder/miopen-builder COPY --from=
  # rocr-export before doing anything else) -- so the CI graph has to reflect
  # that as a real `needs`, not just build rocr in parallel and splice its
  # output into the final image afterward. Same skip-vs-failure-cascade guard
  # as the other gates: a skip only counts as "safe to proceed, reuse the
  # last published rocr image" when it's the user's own unchecked
  # build-rocr input, not a cascade from rocr actually failing.
  rocblas:
    needs: rocr
    if: ${{ !cancelled() && inputs.build-rocblas && (needs.rocr.result == 'success' || (needs.rocr.result == 'skipped' && !inputs.build-rocr)) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: rocblas
      target: rocblas-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-rocr-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  miopen:
    needs: rocr
    if: ${{ !cancelled() && inputs.build-miopen && (needs.rocr.result == 'success' || (needs.rocr.result == 'skipped' && !inputs.build-rocr)) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: miopen
      target: miopen-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-rocr-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  # migraphx builds with -DMIGRAPHX_USE_MIOPEN=On and genuinely links against
  # libMIOpen.so, not just a runtime dlopen -- so it needs the gfx803-patched
  # MIOpen image at build time too, same reasoning as its rocblas dependency.
  migraphx:
    needs: [rocblas, miopen]
    if: ${{ !cancelled() && inputs.build-migraphx
      && (needs.rocblas.result == 'success' || (needs.rocblas.result == 'skipped' && !inputs.build-rocblas))
      && (needs.miopen.result == 'success' || (needs.miopen.result == 'skipped' && !inputs.build-miopen)) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: migraphx
      target: migraphx-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-rocblas-image: true
      with-miopen-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  pytorch:
    needs: rocblas
    if: ${{ !cancelled() && inputs.build-pytorch && (needs.rocblas.result == 'success' || (needs.rocblas.result == 'skipped' && !inputs.build-rocblas)) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: pytorch
      target: pytorch-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-rocblas-image: true
      pytorch-ref: ${{ inputs.pytorch-ref }}
      torchvision-ref: ${{ inputs.torchvision-ref }}
      torchaudio-ref: ${{ inputs.torchaudio-ref }}
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  ort:
    needs: migraphx
    if: ${{ !cancelled() && inputs.build-ort && (needs.migraphx.result == 'success' || (needs.migraphx.result == 'skipped' && !inputs.build-migraphx)) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: ort
      target: ort-builder
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-migraphx-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  final:
    needs: [rocr, miopen, migraphx, pytorch, ort]
    if: ${{ !cancelled()
      && (needs.rocr.result == 'success' || (needs.rocr.result == 'skipped' && !inputs.build-rocr))
      && (needs.miopen.result == 'success' || (needs.miopen.result == 'skipped' && !inputs.build-miopen))
      && (needs.migraphx.result == 'success' || (needs.migraphx.result == 'skipped' && !inputs.build-migraphx))
      && (needs.pytorch.result == 'success' || (needs.pytorch.result == 'skipped' && !inputs.build-pytorch))
      && (needs.ort.result == 'success' || (needs.ort.result == 'skipped' && !inputs.build-ort)) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: final
      final: true
      build-dir: rocm6.4.4
      tag-suffix: -rocm6.4.4
      release-tag: rocm6.4.4
      with-rocr-image: true
      with-miopen-image: true
      with-migraphx-image: true
      with-pytorch-image: true
      with-ort-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}
