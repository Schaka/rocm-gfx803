name: Build gfx803 (therock-experimental)

# EXPERIMENTAL, self-contained, does not touch the gfx803-rocm7.yml /
# gfx803-rocm6.4.4.yml lines or the reusable gfx803-component.yml they
# share -- deliberately its own file with its own package names and
# -therock-experimental tag suffix, so a run of this workflow can never
# publish over :latest-gfx803 or the -rocm6.4.4 line's tags. See
# therock-experimental/README.md for what this line is and is not.
#
# Manual-only, doubly justified here: this repo's other workflows are
# manual-only because every ref is pinned to an immutable point (a
# release-branch tip resolved at dispatch time); this one pins TheRock to
# an exact commit SHA on `main` specifically because gfx803 has no
# release-branch support to track yet (see therock-experimental/README.md)
# -- there is no meaningful "recheck the pin" schedule for a frozen SHA.
#
# Single Dockerfile, staged by --target the same way the mainline
# gfx803-component.yml drives ../Dockerfile -- not reusing that reusable
# workflow itself, since its component/pkg() mapping is hardcoded to the
# rocm7/rocm6.4.4 lines' stage names and package set; duplicating the
# handful of steps it needs here keeps this experimental line from ever
# being able to affect that shared file.

on:
  workflow_dispatch:
    inputs:
      build-therock:
        description: 'Build the TheRock-orchestrated core ROCm stack (ROCR-Runtime/CLR, rocBLAS, MIOpen) for gfx803'
        type: boolean
        required: false
        default: true
      build-migraphx:
        description: 'Build MIGraphX'
        type: boolean
        required: false
        default: true
      build-pytorch:
        description: 'Build PyTorch'
        type: boolean
        required: false
        default: true
      build-torchvision:
        description: 'Build torchvision'
        type: boolean
        required: false
        default: true
      build-torchaudio:
        description: 'Build torchaudio'
        type: boolean
        required: false
        default: true
      build-ort:
        description: 'Build ONNX Runtime'
        type: boolean
        required: false
        default: true
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        type: boolean
        required: false
        default: false
      no-cache:
        description: 'Force a fully fresh build, ignoring the registry build cache'
        type: boolean
        required: false
        default: false

jobs:
  therock:
    if: ${{ inputs.build-therock }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          swap-size-gb: '24'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: therock-experimental
          file: therock-experimental/Dockerfile
          push: true
          target: therock-builder
          tags: ghcr.io/${{ github.repository_owner }}/rocm-therock-builder:gfx803-therock-experimental
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.no-cache && '' || 'type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-builder:cache-gfx803-therock-experimental' }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-builder:cache-gfx803-therock-experimental,mode=max

  migraphx:
    needs: therock
    if: ${{ !cancelled() && inputs.build-migraphx && (needs.therock.result == 'success' || (needs.therock.result == 'skipped' && !inputs.build-therock)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          swap-size-gb: '16'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: therock-experimental
          file: therock-experimental/Dockerfile
          push: true
          target: migraphx-builder
          build-args: |
            THEROCK_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-builder:gfx803-therock-experimental
          tags: ghcr.io/${{ github.repository_owner }}/rocm-therock-migraphx-builder:gfx803-therock-experimental
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.no-cache && '' || 'type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-migraphx-builder:cache-gfx803-therock-experimental' }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-migraphx-builder:cache-gfx803-therock-experimental,mode=max

  pytorch:
    needs: migraphx
    if: ${{ !cancelled() && inputs.build-pytorch && (needs.migraphx.result == 'success' || (needs.migraphx.result == 'skipped' && !inputs.build-migraphx)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          swap-size-gb: '24'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: therock-experimental
          file: therock-experimental/Dockerfile
          push: true
          target: pytorch-builder
          build-args: |
            MIGRAPHX_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-migraphx-builder:gfx803-therock-experimental
          tags: ghcr.io/${{ github.repository_owner }}/rocm-therock-pytorch-builder:gfx803-therock-experimental
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.no-cache && '' || 'type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-pytorch-builder:cache-gfx803-therock-experimental' }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-pytorch-builder:cache-gfx803-therock-experimental,mode=max

  torchvision:
    needs: pytorch
    if: ${{ !cancelled() && inputs.build-torchvision && (needs.pytorch.result == 'success' || (needs.pytorch.result == 'skipped' && !inputs.build-pytorch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: therock-experimental
          file: therock-experimental/Dockerfile
          push: true
          target: torchvision-builder
          build-args: |
            MIGRAPHX_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-migraphx-builder:gfx803-therock-experimental
            PYTORCH_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-pytorch-builder:gfx803-therock-experimental
          tags: ghcr.io/${{ github.repository_owner }}/rocm-therock-torchvision-builder:gfx803-therock-experimental
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.no-cache && '' || 'type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-torchvision-builder:cache-gfx803-therock-experimental' }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-torchvision-builder:cache-gfx803-therock-experimental,mode=max

  torchaudio:
    needs: pytorch
    if: ${{ !cancelled() && inputs.build-torchaudio && (needs.pytorch.result == 'success' || (needs.pytorch.result == 'skipped' && !inputs.build-pytorch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: therock-experimental
          file: therock-experimental/Dockerfile
          push: true
          target: torchaudio-builder
          build-args: |
            MIGRAPHX_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-migraphx-builder:gfx803-therock-experimental
            PYTORCH_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-pytorch-builder:gfx803-therock-experimental
          tags: ghcr.io/${{ github.repository_owner }}/rocm-therock-torchaudio-builder:gfx803-therock-experimental
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.no-cache && '' || 'type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-torchaudio-builder:cache-gfx803-therock-experimental' }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-torchaudio-builder:cache-gfx803-therock-experimental,mode=max

  ort:
    needs: migraphx
    if: ${{ !cancelled() && inputs.build-ort && (needs.migraphx.result == 'success' || (needs.migraphx.result == 'skipped' && !inputs.build-migraphx)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          swap-size-gb: '16'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: therock-experimental
          file: therock-experimental/Dockerfile
          push: true
          target: ort-builder
          build-args: |
            MIGRAPHX_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-migraphx-builder:gfx803-therock-experimental
          tags: ghcr.io/${{ github.repository_owner }}/rocm-therock-ort-builder:gfx803-therock-experimental
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.no-cache && '' || 'type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-ort-builder:cache-gfx803-therock-experimental' }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-ort-builder:cache-gfx803-therock-experimental,mode=max

  final:
    needs: [migraphx, torchvision, torchaudio, ort]
    if: ${{ !cancelled()
      && (needs.migraphx.result == 'success' || (needs.migraphx.result == 'skipped' && !inputs.build-migraphx))
      && (needs.torchvision.result == 'success' || (needs.torchvision.result == 'skipped' && !inputs.build-torchvision))
      && (needs.torchaudio.result == 'success' || (needs.torchaudio.result == 'skipped' && !inputs.build-torchaudio))
      && (needs.ort.result == 'success' || (needs.ort.result == 'skipped' && !inputs.build-ort)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          swap-size-gb: '0'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute build date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: therock-experimental
          file: therock-experimental/Dockerfile
          push: true
          target: final
          build-args: |
            MIGRAPHX_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-migraphx-builder:gfx803-therock-experimental
            TORCHVISION_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-torchvision-builder:gfx803-therock-experimental
            TORCHAUDIO_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-torchaudio-builder:gfx803-therock-experimental
            ORT_IMAGE=ghcr.io/${{ github.repository_owner }}/rocm-therock-ort-builder:gfx803-therock-experimental
          tags: |
            ghcr.io/${{ github.repository_owner }}/rocm-therock-experimental:latest-gfx803-therock-experimental
            ghcr.io/${{ github.repository_owner }}/rocm-therock-experimental:${{ steps.date.outputs.date }}-gfx803-therock-experimental
          no-cache: ${{ inputs.no-cache }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rocm-therock-experimental:cache-gfx803-therock-experimental,mode=min
