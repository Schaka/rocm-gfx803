name: Build gfx803 pytorch stage (local, artifact handoff)

# PyTorch's from-source compile alone exceeds a single 360-minute CI job --
# see the "PyTorch's from-source compile alone exceeds a single CI job's
# 6-hour wall clock" comment in the Dockerfile above pytorch-configure for
# why. That's split across several stages/jobs here, each with its own
# fresh 360-minute budget, chained via a docker-save/docker-load handoff
# through a workflow artifact -- NOT a registry push, so none of the
# intermediate compile stages show up as packages. Only the last stage
# (pytorch-builder) is real, published output -- this workflow builds and
# pushes that one too (with push-tag set), rather than handing it back to
# gfx803-component.yml, since it has the exact same "must build FROM a
# locally-loaded image" requirement as every stage before it.
#
# docker/setup-buildx-action's default builder runs BuildKit in its own
# container, isolated from the host dockerd's image store -- a docker-load
# result would be invisible to that builder's FROM resolution. This
# workflow instead builds directly against the host daemon (`docker build`,
# no buildx container builder), so a loaded image is immediately resolvable
# by tag.

on:
  workflow_call:
    inputs:
      target:
        description: 'Dockerfile target stage to build (pytorch-configure|pytorch-compile-1|pytorch-compile-2)'
        required: true
        type: string
      download-artifact-name:
        description: 'Prior stage''s artifact to download and docker-load before building (empty for the first stage)'
        required: false
        type: string
        default: ''
      download-build-arg:
        description: 'Build-arg name the loaded image''s tag gets passed as (e.g. PYTORCH_CONFIGURE_IMAGE) -- required whenever download-artifact-name is set'
        required: false
        type: string
        default: ''
      upload-artifact-name:
        description: 'Name to upload this stage''s built image under, for the next stage to download (empty when push-tag is set instead)'
        required: false
        type: string
        default: ''
      push:
        description: 'Push this stage as the real ghcr.io/<owner>/rocm-migraphx-torch-builder:gfx803 package instead of uploading an artifact (the final pytorch-builder stage only -- same tag gfx803-component.yml would use for the "pytorch" component)'
        required: false
        type: boolean
        default: false
      with-migraphx-image:
        description: 'Pass MIGRAPHX_IMAGE so this build COPYs from the prebuilt MIGraphX image (first stage only)'
        required: false
        type: boolean
        default: false
      pytorch-ref:
        description: 'Override PYTORCH_REF (empty uses the Dockerfile default)'
        required: false
        type: string
        default: ''
      swap-size-gb:
        description: 'Swap size passed to prepare-runner'
        required: false
        type: string
        default: '24'
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner
        uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          swap-size-gb: ${{ inputs.swap-size-gb }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prior stage artifact
        if: inputs.download-artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.download-artifact-name }}
          path: /tmp/pytorch-stage-in

      - name: Load prior stage image
        if: inputs.download-artifact-name != ''
        run: zstd -d --stdout /tmp/pytorch-stage-in/image.tar.zst | docker load

      - name: Assemble build-args
        id: meta
        run: |
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "build-args<<ARGS_EOF"
            echo "ROCM_ARCH=gfx803"
            if [ "${{ inputs.with-migraphx-image }}" = "true" ]; then
              echo "MIGRAPHX_IMAGE=${owner}/rocm-migraphx-builder:gfx803"
            fi
            if [ -n "${{ inputs.download-artifact-name }}" ]; then
              echo "${{ inputs.download-build-arg }}=pytorch-stage:local"
            fi
            [ -n "${{ inputs.pytorch-ref }}" ] && echo "PYTORCH_REF=${{ inputs.pytorch-ref }}"
            echo "ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Plain `docker build`, not buildx -- see the header comment on why
      # the container-isolated buildx builder can't see a docker-load'd
      # image. --pull left off deliberately: MIGRAPHX_IMAGE is pulled
      # explicitly below when this is the first stage, and later stages
      # must NOT try to pull pytorch-stage:local from a registry.
      - name: Pull MIGraphX image
        if: inputs.with-migraphx-image
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rocm-migraphx-builder:gfx803"

      - name: Build stage
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          args=()
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--build-arg "$line")
          done <<< "${{ steps.meta.outputs.build-args }}"
          docker build "${args[@]}" \
            --target "${{ inputs.target }}" \
            -t pytorch-stage:local \
            -f Dockerfile .

      # Two mutually exclusive endings: intermediate stages hand their
      # image to the next job via an artifact; the final stage (push: true)
      # pushes it as the real published package instead, same tag
      # gfx803-component.yml would have used for the "pytorch" component.
      - name: Tag and push
        if: inputs.push
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rocm-migraphx-torch-builder:gfx803"
          docker tag pytorch-stage:local "$tag"
          docker push "$tag"

      - name: Save and compress image
        if: '! inputs.push'
        run: docker save pytorch-stage:local | zstd -3 -T0 -o image.tar.zst

      - name: Upload artifact
        if: '! inputs.push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.upload-artifact-name }}
          path: image.tar.zst
          # Only needed by the next job in this same run -- not a build
          # product anyone downloads later.
          retention-days: 1
