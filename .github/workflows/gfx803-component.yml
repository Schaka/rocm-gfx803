name: Build gfx803 component

# Reusable single-component build for gfx803. Structurally the same idea as
# the mainline repo's build-component.yml -- each component gets its own
# runner and its own 360-minute budget, and publishes an intermediate image
# the next component COPYs from. No arch matrix: gfx803 is the only target
# this file ever builds, across three build lines (rocm10 at the repo root,
# rocm7.14/ and rocm6.4.4/ the older lines). The published packages are
# shared with the mainline repo's own pipeline -- gfx803 is just another
# arch tag there.

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name -- drives the package and the Dockerfile target (rocr-clr|rocr|rocblas|miopen|rocsolver|migraphx|pytorch|torchvision|torchaudio|ort|final)'
        required: true
        type: string
      target:
        description: 'Dockerfile target stage to build; empty string builds the final image'
        required: false
        type: string
        default: ''
      final:
        description: 'Tag as the published :latest-<arch>/:<date>-<arch> image instead of a :<arch> intermediate'
        required: false
        type: boolean
        default: false
      # Only the ROCm 10.0 line is built in CI today; these inputs stay so an
      # archived line (rocm7.14/, rocm6.4.4/) can still be built by pointing the
      # reusable workflow at its own directory. Two lines publishing to the same
      # package without distinct suffixes overwrite each other -- including
      # :latest-gfx803, the one downstream consumers actually pull -- which is why
      # the suffix exists at all.
      build-dir:
        description: 'Directory holding the Dockerfile, and the build context (. | rocm7.14 | rocm6.4.4)'
        required: false
        type: string
        default: '.'
      tag-suffix:
        description: 'Appended to every tag and to the cache ref, e.g. -rocm7.14. Empty for the rocm10 (main) line.'
        required: false
        type: string
        default: ''
      intermediate-suffix:
        description: 'Suffix on the INTERMEDIATE component tags and cache refs only, e.g. -rocm10. Defaults to tag-suffix; the main line sets it because its component images are published under the unsuffixed ":gfx803" tag that an earlier line of this repo also used -- so a component whose job has not republished since still resolves to the other line, and nothing but an explicit name catches that. The final image keeps the tag people actually pull (latest-gfx803).'
        required: false
        type: string
        default: ''
      release-tag:
        description: 'ROCm-release tag component for the final image, e.g. rocm10.0'
        required: false
        type: string
        default: 'rocm10.0'
      with-rocr-clr-image:
        description: 'Pass ROCR_CLR_IMAGE so this build COPYs from the prebuilt ROCR-Runtime/CLR image'
        required: false
        type: boolean
        default: false
      with-rocr-image:
        description: 'Pass ROCR_IMAGE so this build COPYs from the prebuilt gfx803 ROCR-Runtime (libhsa) image'
        required: false
        type: boolean
        default: false
      with-rocblas-image:
        description: 'Pass ROCBLAS_IMAGE so this build COPYs from the prebuilt rocBLAS image'
        required: false
        type: boolean
        default: false
      with-miopen-image:
        description: 'Pass MIOPEN_IMAGE so this build COPYs from the prebuilt MIOpen image'
        required: false
        type: boolean
        default: false
      with-rocsolver-image:
        description: 'Pass ROCSOLVER_IMAGE so this build COPYs from the prebuilt rocSOLVER image'
        required: false
        type: boolean
        default: false
      with-migraphx-image:
        description: 'Pass MIGRAPHX_IMAGE so this build COPYs from the prebuilt MIGraphX image'
        required: false
        type: boolean
        default: false
      with-pytorch-image:
        description: 'Pass PYTORCH_IMAGE so this build COPYs from the prebuilt PyTorch image'
        required: false
        type: boolean
        default: false
      with-torchvision-image:
        description: 'Pass TORCHVISION_IMAGE so this build COPYs from the prebuilt torchvision image'
        required: false
        type: boolean
        default: false
      with-torchaudio-image:
        description: 'Pass TORCHAUDIO_IMAGE so this build COPYs from the prebuilt torchaudio image'
        required: false
        type: boolean
        default: false
      with-ort-image:
        description: 'Pass ORT_IMAGE so this build COPYs from the prebuilt ORT image'
        required: false
        type: boolean
        default: false
      pytorch-ref:
        description: 'Override PYTORCH_REF (empty uses the Dockerfile default)'
        required: false
        type: string
        default: ''
      torchvision-ref:
        description: 'Override TORCHVISION_REF (empty uses the Dockerfile default)'
        required: false
        type: string
        default: ''
      torchaudio-ref:
        description: 'Override TORCHAUDIO_REF (empty uses the Dockerfile default)'
        required: false
        type: string
        default: ''
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        required: false
        type: boolean
        default: false
      no-cache:
        description: 'Ignore cache-from and force a fully fresh build (bypasses a possibly-stale registry cache)'
        required: false
        type: boolean
        default: false
      swap-size-gb:
        description: 'Swap size passed to prepare-runner. Override per-component when a single compile step spikes RSS well past the default.'
        required: false
        type: string
        default: '16'
      tensor-topk-opt-level:
        description: 'Override TENSOR_TOPK_OPT_LEVEL (empty uses the Dockerfile default, -O3). Lower this for pytorch specifically -- TensorTopK.hip''s -O3 AMDGPU backend compile has been measured taking 40GB+ RSS+swap and multiple hours; -O1 clears it in under a minute.'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same disk pressure the mainline repo's builds see, and then some: a
      # full ROCm install rather than a runtime-only one, and rocBLAS's
      # Tensile step generates a large intermediate tree even for a single
      # architecture (which is why the Dockerfile passes --cleanup). The
      # non-zero swap size keeps the runner's own swap in place as a
      # memory-pressure safety net for the compile stages.
      - name: Prepare runner
        uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          swap-size-gb: ${{ inputs.swap-size-gb }}
          registry-username: ${{ secrets.GHCR_PAT != '' && github.repository_owner || github.actor }}
          registry-password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute build date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Same packages the mainline (rocm-migraphx-ort-builder) repo publishes
      # to, with gfx803 as just another arch tag -- this split kept the
      # package names on purpose so nothing downstream had to change. rocr-clr
      # and miopen get their own packages rather than being built inline by
      # whatever stage happens to need them: both are needed by more than one
      # downstream stage (ROCR/CLR by rocblas AND miopen; MIOpen by final),
      # and a stage that isn't handed a prebuilt image recompiles it from
      # source inside its own job -- so without these, the final job alone
      # would compile ROCR, CLR and MIOpen on top of everything else it does,
      # inside one 360-minute, disk-tight runner.
      - name: Assemble tags, build-args and cache ref
        id: meta
        run: |
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          pkg() {
            case "$1" in
              rocr-clr) echo "${owner}/rocm-rocr-clr-builder" ;;
              rocr)     echo "${owner}/rocm-rocr-builder" ;;
              rocblas)  echo "${owner}/rocm-rocblas-builder" ;;
              miopen)   echo "${owner}/rocm-miopen-builder" ;;
              rocsolver) echo "${owner}/rocm-rocsolver-builder" ;;
              migraphx) echo "${owner}/rocm-migraphx-builder" ;;
              pytorch)  echo "${owner}/rocm-migraphx-torch-builder" ;;
              torchvision) echo "${owner}/rocm-torchvision-builder" ;;
              torchaudio)  echo "${owner}/rocm-torchaudio-builder" ;;
              ort)      echo "${owner}/rocm-migraphx-ort-builder" ;;
              final)    echo "${owner}/rocm-migraphx-ort-torch-builder" ;;
            esac
          }
          component="${{ inputs.component }}"
          self="$(pkg "${component}")"
          # Every tag this workflow reads or writes carries the suffix, so the
          # build lines never see each other's images -- an intermediate
          # pulled without it would silently mix a 6.4.4/7.14 component into
          # a 10.0 build, which fails much later and very confusingly.
          arch="gfx803${{ inputs.intermediate-suffix != '' && inputs.intermediate-suffix || inputs.tag-suffix }}"
          # The final image's tags keep following tag-suffix only: "latest-gfx803"
          # is what downstream Dockerfiles and users pull, and the line is already
          # spelled out by the release-tag form (rocm10.0-gfx803). Only the
          # intermediate component images -- the ones stages consume by name -- get
          # the line made explicit in their tag.
          farch="gfx803${{ inputs.tag-suffix }}"

          {
            echo "build-args<<ARGS_EOF"
            echo "ROCM_ARCH=gfx803"
            if [ "${{ inputs.with-rocr-clr-image }}" = "true" ]; then
              echo "ROCR_CLR_IMAGE=$(pkg rocr-clr):${arch}"
            fi
            if [ "${{ inputs.with-rocr-image }}" = "true" ]; then
              echo "ROCR_IMAGE=$(pkg rocr):${arch}"
            fi
            if [ "${{ inputs.with-rocblas-image }}" = "true" ]; then
              echo "ROCBLAS_IMAGE=$(pkg rocblas):${arch}"
            fi
            if [ "${{ inputs.with-miopen-image }}" = "true" ]; then
              echo "MIOPEN_IMAGE=$(pkg miopen):${arch}"
            fi
            if [ "${{ inputs.with-rocsolver-image }}" = "true" ]; then
              echo "ROCSOLVER_IMAGE=$(pkg rocsolver):${arch}"
            fi
            if [ "${{ inputs.with-migraphx-image }}" = "true" ]; then
              echo "MIGRAPHX_IMAGE=$(pkg migraphx):${arch}"
            fi
            if [ "${{ inputs.with-pytorch-image }}" = "true" ]; then
              echo "PYTORCH_IMAGE=$(pkg pytorch):${arch}"
            fi
            if [ "${{ inputs.with-torchvision-image }}" = "true" ]; then
              echo "TORCHVISION_IMAGE=$(pkg torchvision):${arch}"
            fi
            if [ "${{ inputs.with-torchaudio-image }}" = "true" ]; then
              echo "TORCHAUDIO_IMAGE=$(pkg torchaudio):${arch}"
            fi
            if [ "${{ inputs.with-ort-image }}" = "true" ]; then
              echo "ORT_IMAGE=$(pkg ort):${arch}"
            fi
            # Empty means "leave the Dockerfile's pin alone" -- passing an
            # empty build-arg would override the ARG default with "" and break
            # the clone, so each is only emitted when actually set.
            [ -n "${{ inputs.pytorch-ref }}" ] && echo "PYTORCH_REF=${{ inputs.pytorch-ref }}"
            [ -n "${{ inputs.torchvision-ref }}" ] && echo "TORCHVISION_REF=${{ inputs.torchvision-ref }}"
            [ -n "${{ inputs.torchaudio-ref }}" ] && echo "TORCHAUDIO_REF=${{ inputs.torchaudio-ref }}"
            [ -n "${{ inputs.tensor-topk-opt-level }}" ] && echo "TENSOR_TOPK_OPT_LEVEL=${{ inputs.tensor-topk-opt-level }}"

            # Resolve each branch pin to whatever its tip is right now, per run,
            # and pass that down. Nobody sets these by hand: the Dockerfile's
            # *_REF branches remain the only human-authored pins, and the resolved
            # commits land in the image's own /opt/rocm/.gfx803-line + labels.
            # The Dockerfile keeps the branch as the documented policy; this is
            # what makes a moved upstream tip visible to the layer cache (the
            # clone happens inside a RUN, so the command text -- the cache key --
            # would otherwise be identical across AMD's pushes) and is what the
            # component image's .gfx803-line marker records. Resolution failure is
            # fatal on purpose: silently building an untracked tip is the thing
            # this guards.
            df="${{ inputs.build-dir }}/Dockerfile"
            pins=""
            resolve() { # ref_arg sha_arg url override
              local ref sha mp attempt
              ref="$4"
              if [ -z "$ref" ]; then
                ref="$(grep -m1 -E "^ARG $1=" "$df" | cut -d= -f2- | tr -d '\"')"
              fi
              if printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
                sha="$ref"
              else
                # "<sha>\t<refname>" from ls-remote; a tag can name a tag object,
                # so prefer the peeled "<tag>^{}" commit when the server offers it.
                # Retry, because a transient github failure should not fail a
                # build -- but no resolution at all is fatal: an image that
                # cannot say which commit it holds is the thing this guards.
                mp=""
                for attempt in 1 2 3; do
                  mp="$(git ls-remote "$3" "refs/tags/$ref^{}" "refs/heads/$ref" "refs/tags/$ref" 2>/dev/null || true)"
                  [ -n "$mp" ] && break
                  sleep $((attempt * 5))
                done
                sha="$(printf '%s\n' "$mp" | awk -v w="refs/tags/$ref^{}" '$2==w {print $1; exit}')"
                if [ -z "$sha" ]; then
                  sha="$(printf '%s\n' "$mp" | awk -v a="refs/heads/$ref" -v b="refs/tags/$ref" '$2==a || $2==b {print $1; exit}')"
                fi
              fi
              if [ -z "$sha" ]; then
                echo "FATAL: could not resolve $1=\"$ref\" against $3" >&2
                exit 1
              fi
              echo "$2=$sha"
              pins="$pins $1=$sha"
            }
            resolve ROCM_SYSTEMS_REF   ROCM_SYSTEMS_SHA   https://github.com/ROCm/rocm-systems.git   ''
            resolve ROCM_LIBRARIES_REF ROCM_LIBRARIES_SHA https://github.com/ROCm/rocm-libraries.git ''
            resolve MIGRAPHX_REF       MIGRAPHX_SHA       https://github.com/ROCm/AMDMIGraphX.git    ''
            resolve PYTORCH_REF        PYTORCH_SHA        https://github.com/ROCm/pytorch.git        '${{ inputs.pytorch-ref }}'
            resolve TORCHVISION_REF    TORCHVISION_SHA    https://github.com/pytorch/vision.git      '${{ inputs.torchvision-ref }}'
            resolve TORCHAUDIO_REF     TORCHAUDIO_SHA     https://github.com/ROCm/audio.git          '${{ inputs.torchaudio-ref }}'
            resolve ORT_VERSION        ORT_SHA            https://github.com/microsoft/onnxruntime.git ''
            echo "GFX803_SOURCE_REV=${GITHUB_SHA}"
            echo "GFX803_PINS=${pins# }"
            echo "ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.final }}" = "true" ]; then
            {
              echo "tags<<TAGS_EOF"
              echo "${self}:latest-${farch}"
              # No suffix on this one: the ROCm release already names the line
              # (rocm6.4.4-gfx803 vs rocm7.14-gfx803 vs rocm10.0-gfx803), so
              # adding it would just read as rocm10.0-gfx803-rocm10.
              echo "${self}:${{ inputs.release-tag }}-gfx803"
              echo "${self}:${{ steps.date.outputs.date }}-${farch}"
              echo "TAGS_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${self}:${arch}" >> "$GITHUB_OUTPUT"
          fi

          echo "cache-ref=${self}:cache-${arch}" >> "$GITHUB_OUTPUT"

          # final's cache is never consumed downstream (nothing builds FROM the
          # final image), so mode=max there just re-exports every inherited
          # layer as a cache blob for no benefit -- pure disk pressure on the
          # runner during the export step, which is exactly where these builds
          # have been running out of space. mode=min only exports the layers
          # unique to this build.
          if [ "${{ inputs.final }}" = "true" ]; then
            echo "cache-mode=min" >> "$GITHUB_OUTPUT"
          else
            echo "cache-mode=max" >> "$GITHUB_OUTPUT"
          fi

      # no-cache bypasses cache-from entirely rather than just skipping cache-to,
      # so a bad/stale layer already sitting under cache-ref can't be reused --
      # this run still repopulates cache-ref with a fresh result.
      #
      # Plain `buildx build` (not docker/build-push-action) so a 429 from
      # ghcr.io's lazy blob pull can be retried: BuildKit doesn't retry those
      # on its own, and there is no way to wrap an arbitrary `uses:` step in a
      # retry loop, only a shell command.
      - name: Build and push image
        run: |
          set -euo pipefail
          args=(--push --file "${{ inputs.build-dir }}/Dockerfile")

          # Context is the build line's own directory, not necessarily the
          # repo root: rocm10 (build-dir '.') IS the repo root; rocm7.14 and
          # rocm6.4.4 are self-contained under their own directory and COPY
          # only from their own patches/ (see each Dockerfile's header).
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          while IFS= read -r build_arg; do
            [ -n "$build_arg" ] && args+=(--build-arg "$build_arg")
          done <<< "${{ steps.meta.outputs.build-args }}"

          if [ -n "${{ inputs.target }}" ]; then
            args+=(--target "${{ inputs.target }}")
          fi

          if [ "${{ inputs.no-cache }}" = "true" ]; then
            args+=(--no-cache)
          else
            args+=(--cache-from "type=registry,ref=${{ steps.meta.outputs.cache-ref }}")
          fi
          args+=(--cache-to "type=registry,ref=${{ steps.meta.outputs.cache-ref }},mode=${{ steps.meta.outputs.cache-mode }}")

          source scripts/lib/bake-retry.sh
          build_push_with_retry "${args[@]}" "${{ inputs.build-dir }}"
