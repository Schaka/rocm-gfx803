name: Build gfx803 (rocm7, main)

# Manual-only, same reasoning as the rocm6.4.4 workflow: every version in
# this repo's root Dockerfile is pinned to an immutable ref (a TheRock
# meta-release tag plus exact rocm-systems/rocm-libraries commit SHAs, a
# MIGraphX tag, a torch ref, an ORT tag), so a nightly run would rebuild
# byte-identical inputs and republish the same image. Run it when a pin
# changes, or when something needs re-verifying on hardware.
#
# Chain: rocr-clr -> {rocblas, miopen} -> migraphx -> {pytorch, ort} -> final.
# rocr-clr (patched ROCR-Runtime/CLR: legacy-doorbell restore, VA-reuse
# defer) is needed by both rocblas and miopen, which both build from it in
# parallel. migraphx needs rocblas (links it). pytorch and ort both build
# from migraphx's /opt/rocm (not rocblas directly), and are independent of
# each other, so they run in parallel. final assembles migraphx + miopen +
# pytorch + ort.
#
# This produces the *unsuffixed* :latest-gfx803/:gfx803/:cache-gfx803 tags --
# rocm7 is this repo's main line. rocm6.4.4 (the older, still-maintained-
# but-no-longer-primary line) publishes under a -rocm6.4.4 suffix instead,
# see gfx803-rocm6.4.4.yml.
#
# Each component is individually skippable -- these builds are long and the
# inputs rarely all change at once. A skipped component's downstream jobs
# reuse whatever that component last published.

on:
  workflow_dispatch:
    inputs:
      build-rocr-clr:
        description: 'Build patched ROCR-Runtime/CLR (legacy-doorbell restore, VA-reuse defer) for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-rocblas:
        description: 'Build rocBLAS for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-miopen:
        description: 'Build MIOpen for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-migraphx:
        description: 'Build MIGraphX'
        type: boolean
        required: false
        default: true
      build-pytorch:
        description: 'Build PyTorch + torchvision + torchaudio'
        type: boolean
        required: false
        default: true
      build-ort:
        description: 'Build ONNX Runtime'
        type: boolean
        required: false
        default: true
      pytorch-ref:
        description: 'Override PYTORCH_REF. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      torchvision-ref:
        description: 'Override TORCHVISION_REF. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      torchaudio-ref:
        description: 'Override TORCHAUDIO_REF. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        type: boolean
        required: false
        default: false
      no-cache:
        description: 'Force a fully fresh build, ignoring the registry build cache (use if a component is suspected stale/corrupted)'
        type: boolean
        required: false
        default: false

jobs:
  rocr-clr:
    if: ${{ inputs.build-rocr-clr }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: rocr-clr
      target: rocr-clr-builder
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  # `needs` + a skipped dependency: GitHub reports result == 'skipped', not
  # 'success', so every downstream gate has to accept both -- otherwise
  # unchecking build-rocr-clr would cascade into skipping the whole
  # pipeline instead of reusing the published image.
  rocblas:
    needs: rocr-clr
    if: ${{ !cancelled() && inputs.build-rocblas && (needs.rocr-clr.result == 'success' || needs.rocr-clr.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: rocblas
      target: rocblas-builder
      with-rocr-clr-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  miopen:
    needs: rocr-clr
    if: ${{ !cancelled() && inputs.build-miopen && (needs.rocr-clr.result == 'success' || needs.rocr-clr.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: miopen
      target: miopen-builder
      with-rocr-clr-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  migraphx:
    needs: rocblas
    if: ${{ !cancelled() && inputs.build-migraphx && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: migraphx
      target: migraphx-builder
      with-rocblas-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  pytorch:
    needs: migraphx
    if: ${{ !cancelled() && inputs.build-pytorch && (needs.migraphx.result == 'success' || needs.migraphx.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: pytorch
      target: pytorch-builder
      with-migraphx-image: true
      pytorch-ref: ${{ inputs.pytorch-ref }}
      torchvision-ref: ${{ inputs.torchvision-ref }}
      torchaudio-ref: ${{ inputs.torchaudio-ref }}
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  ort:
    needs: migraphx
    if: ${{ !cancelled() && inputs.build-ort && (needs.migraphx.result == 'success' || needs.migraphx.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: ort
      target: ort-builder
      with-migraphx-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  final:
    needs: [migraphx, miopen, pytorch, ort]
    if: ${{ !cancelled()
      && (needs.migraphx.result == 'success' || needs.migraphx.result == 'skipped')
      && (needs.miopen.result == 'success' || needs.miopen.result == 'skipped')
      && (needs.pytorch.result == 'success' || needs.pytorch.result == 'skipped')
      && (needs.ort.result == 'success' || needs.ort.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: final
      final: true
      with-migraphx-image: true
      with-miopen-image: true
      with-pytorch-image: true
      with-ort-image: true
      release-tag: rocm7.14
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}
