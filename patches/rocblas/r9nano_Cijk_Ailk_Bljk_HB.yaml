# gfx803 (r9nano) fp16 (non-HPA) GEMM library logic.
#
# WHY: Tensile's fp16 codegen could not generate gfx803 kernels at all until
# tensile-gfx803-fp16-nond16.patch (d16/packed-fp16 ops are GFX9+ only), so
# the rocBLAS Logic tree had no fp16 config for gfx803 and every fp16 GEMM on
# this hardware fell through to the generic _fallback_ kernel. With the patch
# applied, this config makes the rocBLAS build's Tensile library generation
# (asm_full) emit real fp16 kernels. Copied into the rocBLAS Logic tree by
# the root Dockerfile; see TENSILE_GFX803_FP16_TODO.md for the investigation
# and the on-hardware benchmark (the MT32x64x8 kernel below measured
# ~1.3-1.4x over the rocBLAS fp16 fallback at the model's shapes).
#
# The single solution is the verified MT32x64x8 kernel (tail + unrolled main
# loop both validate 0-mismatch on the RX 470). The ExactLogic table maps the
# model's shapes to it. Add more tile variants + a tuning sweep if a broader
# shape coverage is wanted later.
